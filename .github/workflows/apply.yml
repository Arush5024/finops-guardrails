name: Apply

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - modules/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    # The apply role only trusts this environment; add required reviewers to it
    # in the repository settings to gate every apply behind an approval.
    environment: production
    if: vars.AWS_APPLY_ROLE_ARN != ''
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_owner: ${{ vars.TF_OWNER }}
      TF_VAR_github_repo: ${{ github.repository }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_alert_emails: '["${{ vars.ALERT_EMAIL }}"]'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=ap-south-1"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve
